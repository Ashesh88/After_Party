<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turbo 3D Racer - Luxury 2-Player Duel</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 3D Three.js WebGL Canvas Viewport -->
    <div id="canvas-container"></div>

    <!-- UI Overlay HUD Layer -->
    <div class="ui-layer">
        <!-- Top Compact Floating Header Bar -->
        <header class="top-dock-panel interactive">
            <div class="top-row">
                <!-- Live Track Progress Bar with Car Pins -->
                <div class="track-progress-container">
                    <span class="track-start-pin">🏁</span>
                    <div class="track-line-wrapper">
                        <div class="track-line-base"></div>
                        <!-- P1 Pin (You - Pink Hypercar) -->
                        <div class="track-pin p1-pin" id="pin-p1" style="left: 0%;">
                            <span class="pin-dot">🏎️</span>
                            <span class="pin-tag">P1</span>
                        </div>
                        <!-- P2 Pin (Friend - Cyan Hypercar) -->
                        <div class="track-pin p2-pin" id="pin-p2" style="left: 0%;">
                            <span class="pin-dot">🏎️</span>
                            <span class="pin-tag">P2</span>
                        </div>
                    </div>
                    <span class="track-finish-pin">🏆 1500m</span>
                </div>

                <!-- Utilities (Mode / Sound / Restart) -->
                <div class="util-actions">
                    <button class="mode-btn active" id="btn-mode-2p" title="2-Player Duel">
                        <i class="fa-solid fa-user-group"></i>
                        <span class="mode-txt">2P</span>
                    </button>
                    <button class="mode-btn" id="btn-mode-bot" title="vs AI Friend Bot">
                        <i class="fa-solid fa-robot"></i>
                        <span class="mode-txt">Bot</span>
                    </button>
                    <button class="btn-icon" id="btn-cam" title="Camera Angle">
                        <i class="fa-solid fa-video"></i>
                    </button>
                    <button class="btn-icon" id="btn-restart" title="Restart">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </div>

            <!-- Match Status Banner -->
            <div class="match-meta-row">
                <div class="status-pill leader-pill" id="leader-display">
                    <span class="leader-dot"></span>
                    <span id="leader-text">Ready to Race</span>
                </div>
                <div class="status-pill dist-pill" id="dist-display">
                    <i class="fa-solid fa-gauge-simple-high"></i>
                    <span id="dist-text">0 / 1500m</span>
                </div>
                <div class="status-pill time-pill" id="time-display">00:00.0</div>
            </div>
        </header>

        <!-- Starting Light Gantry (5 Red Lights -> Green GO!) -->
        <div class="start-gantry-container" id="gantry-container">
            <div class="gantry-box">
                <div class="gantry-light" id="g-light-1"></div>
                <div class="gantry-light" id="g-light-2"></div>
                <div class="gantry-light" id="g-light-3"></div>
                <div class="gantry-light" id="g-light-4"></div>
                <div class="gantry-light" id="g-light-5"></div>
            </div>
            <div class="gantry-text" id="gantry-text">READY</div>
        </div>

        <!-- Sleek Dual Cockpit Telemetry HUD for Both Racers -->
        <div class="racers-hud interactive">
            <!-- Player 1 (You - Metallic Rose Supercar) -->
            <div class="racer-card p1-card">
                <div class="racer-header">
                    <div class="racer-id-badge p1-badge">
                        <span class="p1-tag">YOU</span>
                        <span class="racer-name" id="p1-name-display">You</span>
                    </div>
                    <span class="racer-pos p1-pos" id="p1-pos">1st</span>
                </div>
                <div class="speed-cluster">
                    <span class="speed-number" id="p1-speed">0</span>
                    <span class="speed-unit">KM/H</span>
                </div>
                <div class="nitro-gauge">
                    <div class="nitro-bar">
                        <div class="nitro-bar-fill p1-nitro" id="p1-nitro-fill" style="width: 100%;"></div>
                    </div>
                    <span class="nitro-lbl">NITRO BOOST</span>
                </div>
            </div>

            <!-- Player 2 (Friend / Partner - Metallic Cyan Supercar) -->
            <div class="racer-card p2-card">
                <div class="racer-header">
                    <div class="racer-id-badge p2-badge">
                        <span class="p2-tag">FRIEND</span>
                        <span class="racer-name" id="p2-name-display">Friend</span>
                    </div>
                    <span class="racer-pos p2-pos" id="p2-pos">2nd</span>
                </div>
                <div class="speed-cluster">
                    <span class="speed-number" id="p2-speed">0</span>
                    <span class="speed-unit">KM/H</span>
                </div>
                <div class="nitro-gauge">
                    <div class="nitro-bar">
                        <div class="nitro-bar-fill p2-nitro" id="p2-nitro-fill" style="width: 100%;"></div>
                    </div>
                    <span class="nitro-lbl">NITRO BOOST</span>
                </div>
            </div>
        </div>

        <!-- Touch Controls - Ergonomic Futuristic Neon Gamepad -->
        <div class="touch-overlay interactive" id="touch-controls">
            <!-- Left Thumb: Precision Steering Wheel Buttons -->
            <div class="touch-group touch-left-group">
                <button class="btn-touch btn-steer" id="touch-p1-left" aria-label="Steer Left">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <button class="btn-touch btn-steer" id="touch-p1-right" aria-label="Steer Right">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <!-- Right Thumb: Gas & Nitro Thrust -->
            <div class="touch-group touch-right-group">
                <button class="btn-touch btn-nitro" id="touch-p1-nitro" aria-label="Nitro Thrust">
                    <i class="fa-solid fa-fire-flame-curved"></i>
                    <span>BOOST</span>
                </button>
                <button class="btn-touch btn-gas" id="touch-p1-gas" aria-label="Accelerate Gas">
                    <i class="fa-solid fa-bolt"></i>
                    <span>GAS</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Victory Celebration Modal -->
    <div class="modal-overlay" id="modal-victory">
        <div class="victory-card interactive">
            <div class="victory-trophy">🏆</div>
            <h2 class="victory-title" id="winner-title">Victory! 🏁</h2>
            <p class="victory-subtitle" id="winner-subtitle">Head-to-Head Highway Champion</p>

            <div class="victory-results-box">
                <div class="res-row winner-row">
                    <span class="res-badge">🥇 1st</span>
                    <span class="res-name" id="res-1st-name">You</span>
                    <span class="res-time" id="res-1st-time">00:42.1</span>
                </div>
                <div class="res-row runner-row">
                    <span class="res-badge">🥈 2nd</span>
                    <span class="res-name" id="res-2nd-name">Friend</span>
                    <span class="res-time" id="res-2nd-time">+0.85s</span>
                </div>
            </div>

            <div class="victory-stats-grid">
                <div class="vstat-item">
                    <span class="vstat-lbl">Top Speed</span>
                    <span class="vstat-val" id="vstat-speed">268 KM/H</span>
                </div>
                <div class="vstat-item">
                    <span class="vstat-lbl">Track Length</span>
                    <span class="vstat-val">1500 M</span>
                </div>
                <div class="vstat-item">
                    <span class="vstat-lbl">Photo Gap</span>
                    <span class="vstat-val" id="vstat-gap">+12 M</span>
                </div>
            </div>

            <button class="btn-race-again" id="btn-race-again">
                <i class="fa-solid fa-rotate-right"></i>
                <span>Rematch / Race Again</span>
            </button>
        </div>
    </div>

    <!-- Bundled Three.js Library -->
    <script src="js/lib/three.min.js"></script>
    <script src="audio.js"></script>
    <script src="js/racer-game.js"></script>
</body>
</html>
