<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Royal 3D Carrom</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 3D WebGL Canvas Viewport -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Layer -->
    <div class="ui-layer">
        <!-- Sleek Top Status & Score Tracking Dock -->
        <div class="top-dock-panel interactive">
            <div class="top-status-row">
                <span class="status-pill" id="status-banner">🎯 New Match! Position striker & aim</span>
                <div class="view-toggle-mini">
                    <button class="toggle-btn active view-btn" id="btn-view-top" title="Top Tactical View">
                        <i class="fa-solid fa-table-cells-large"></i> Top
                    </button>
                    <button class="toggle-btn view-btn" id="btn-view-aim" title="Aim View (Behind Striker)">
                        <i class="fa-solid fa-crosshairs"></i> Aim
                    </button>
                    <button class="toggle-btn view-btn" id="btn-view-orbit" title="Free 3D View">
                        <i class="fa-solid fa-cube"></i> 3D
                    </button>
                </div>
            </div>

            <!-- Compact Player HUD Cards -->
            <div class="players-row">
                <!-- Player 1 Card -->
                <div class="player-card active-turn" id="card-p1">
                    <div class="player-info">
                        <span class="player-name" id="name-p1">You (White)</span>
                        <span class="player-status-badge" id="badge-p1">STRIKING ⚡</span>
                    </div>
                    <span class="player-score" id="score-p1">0 pts</span>
                </div>

                <!-- Player 2 Card -->
                <div class="player-card" id="card-p2">
                    <div class="player-info">
                        <span class="player-name" id="name-p2">Carrom Bot 🤖</span>
                        <span class="player-status-badge" id="badge-p2">WAITING</span>
                    </div>
                    <span class="player-score" id="score-p2">0 pts</span>
                </div>
            </div>
        </div>

        <!-- Bottom Controls HUD (Baseline Position, Shot Power & Action) -->
        <footer class="bottom-hud interactive">
            <!-- Striker Baseline Horizontal Slide -->
            <div class="slider-group">
                <div class="slider-header">
                    <span><i class="fa-solid fa-arrows-left-right"></i> Striker Position</span>
                    <span>Baseline Track</span>
                </div>
                <input type="range" id="slider-baseline" min="-100" max="100" step="1" value="0" class="range-slider">
            </div>

            <!-- Strike Power -->
            <div class="slider-group">
                <div class="slider-header">
                    <span><i class="fa-solid fa-bolt"></i> Strike Power</span>
                    <span id="power-value-label">65%</span>
                </div>
                <input type="range" id="slider-power" min="0.15" max="1.0" step="0.01" value="0.65" class="range-slider power-slider">
            </div>

            <!-- Aim Buttons & Strike Trigger -->
            <div class="hud-actions-row">
                <button class="btn-aim-step" id="btn-aim-left" title="Rotate Aim Left">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
                <button class="btn-shoot-main" id="btn-shoot">
                    <i class="fa-solid fa-bullseye"></i>
                    <span>STRIKE</span>
                </button>
                <button class="btn-aim-step" id="btn-aim-right" title="Rotate Aim Right">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </footer>
    </div>

    <!-- Victory Celebration Modal -->
    <div class="modal-overlay" id="modal-victory">
        <div class="victory-card interactive">
            <div class="victory-icon">👑🎯</div>
            <h2 class="victory-title" id="victory-title">Victory! 🏆</h2>
            <p class="victory-desc" id="victory-desc">Congratulations on winning the Carrom match!</p>
            <button class="btn-victory-replay" id="btn-play-again">
                <i class="fa-solid fa-play"></i> Play Again
            </button>
        </div>
    </div>

    <!-- Bundled Libraries -->
    <script src="js/lib/three.min.js"></script>
    <script src="js/lib/OrbitControls.js"></script>
    <script src="audio.js"></script>

    <!-- 3D Carrom Modules -->
    <script src="js/board3d.js"></script>
    <script src="js/pieces3d.js"></script>
    <script src="js/carrom-physics.js"></script>
    <script src="js/carrom-game.js"></script>
</body>
</html>
