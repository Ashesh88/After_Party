<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luxury 8-Ball Pool</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 3D WebGL Canvas Viewport -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Layer -->
    <div class="ui-layer">
        <!-- Sleek Top Status & Ball Tracking Dock -->
        <div class="top-dock-panel interactive">
            <div class="top-status-row">
                <span class="status-pill" id="status-banner">New Rack! Break the balls</span>
                <div class="view-toggle-mini">
                    <button class="toggle-btn view-btn" id="btn-view-cue" title="Aim View (Behind Stick)">
                        <i class="fa-solid fa-crosshairs"></i> Aim
                    </button>
                    <button class="toggle-btn active view-btn" id="btn-view-top" title="Top-Down Tactical View">
                        <i class="fa-solid fa-table"></i> Top
                    </button>
                    <button class="toggle-btn view-btn" id="btn-view-orbit" title="Free 3D View">
                        <i class="fa-solid fa-cube"></i> 3D
                    </button>
                </div>
                <button class="btn-chat-toggle" id="btn-chat-toggle" title="Open Chat">
                    <i class="fa-solid fa-comment-dots"></i>
                    <span class="chat-dot" id="chat-badge-dot"></span>
                </button>
            </div>

            <!-- Compact Player Cards with Miniature Ball Tracker -->
            <div class="players-rack-row">
                <!-- Player 1 Card -->
                <div class="player-hud-card p1 active-turn" id="card-p1">
                    <div class="player-header-mini">
                        <span class="player-name" id="name-p1">Player 1</span>
                        <span class="ball-badge" id="badge-p1">OPEN TABLE</span>
                    </div>
                    <div class="ball-rack-pills" id="rack-p1"></div>
                </div>

                <!-- Player 2 Card -->
                <div class="player-hud-card p2" id="card-p2">
                    <div class="player-header-mini">
                        <span class="player-name" id="name-p2">Player 2</span>
                        <span class="ball-badge" id="badge-p2">OPEN TABLE</span>
                    </div>
                    <div class="ball-rack-pills" id="rack-p2"></div>
                </div>
            </div>
        </div>

        <!-- 3-Second Floating Incoming Message Toast Bubble -->
        <div class="chat-toast-bubble" id="chat-toast-bubble"></div>

        <!-- Left Side Aim Fine-Tune Wheel (Touch to rotate aim with micro precision) -->
        <div class="aim-wheel-panel interactive" id="aim-wheel-panel" title="Drag thumb up/down to rotate aim">
            <div class="aim-wheel-track" id="aim-wheel-track">
                <div class="aim-wheel-indicator"></div>
            </div>
            <span class="aim-wheel-label">FINE AIM</span>
        </div>

        <!-- Bottom Controls HUD (Shot Power & Strike Action) -->
        <footer class="bottom-hud interactive">
            <div class="power-control-panel">
                <div class="power-header">
                    <span><i class="fa-solid fa-bolt"></i> Strike Power</span>
                    <span class="power-pct" id="power-value-label">50%</span>
                </div>
                <div class="power-slider-wrapper">
                    <input type="range" id="slider-power" min="0.1" max="1.0" step="0.01" value="0.5" class="power-range">
                </div>
            </div>

            <div class="bottom-hud-row">
                <button class="btn-aim-step" id="btn-aim-left" title="Rotate Aim Left">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
                <button class="btn-shoot-main" id="btn-shoot">
                    <i class="fa-solid fa-circle-dot"></i>
                    <span>SHOOT</span>
                </button>
                <button class="btn-aim-step" id="btn-aim-right" title="Rotate Aim Right">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </footer>
    </div>

    <!-- Floating Air-Glass Corner Chat HUD (Collapsible) -->
    <div class="floating-corner-chat interactive closed" id="floating-chat">
        <div class="air-chat-header">
            <span><i class="fa-solid fa-comments"></i> In-Game Chat</span>
            <button class="btn-close-chat" id="btn-close-chat" title="Close"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="air-chat-messages" id="panel-chat-messages">
            <!-- Live match chat messages only (up to 5 messages) -->
        </div>
        <!-- Corner Emojis Bar -->
        <div class="air-chat-emojis">
            <button class="emoji-btn" data-emoji="🎱">🎱</button>
            <button class="emoji-btn" data-emoji="🔥">🔥</button>
            <button class="emoji-btn" data-emoji="👑">👑</button>
            <button class="emoji-btn" data-emoji="👍">👍</button>
            <button class="emoji-btn" data-emoji="🎯">🎯</button>
        </div>
        <!-- Transparent Air Input -->
        <form class="air-chat-input-bar" id="panel-chat-form">
            <input type="text" id="panel-chat-input" placeholder="Type a message..." autocomplete="off">
            <button type="submit" title="Send"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
    </div>

    <!-- Victory Celebration Modal -->
    <div class="modal-overlay" id="modal-victory">
        <div class="victory-card interactive">
            <div class="victory-icon">🎱👑</div>
            <h2 class="victory-title" id="victory-title">Victory! 🏆</h2>
            <p class="victory-desc" id="victory-desc">Masterful 8-Ball shot! Congratulations on winning the game!</p>
            <button class="btn-victory-replay" id="btn-play-again">
                <i class="fa-solid fa-play"></i> Play Again
            </button>
        </div>
    </div>

    <!-- Bundled Libraries -->
    <script src="js/lib/three.min.js"></script>
    <script src="js/lib/OrbitControls.js"></script>
    <script src="audio.js"></script>

    <!-- 3D Pool Modules -->
    <script src="js/table3d.js"></script>
    <script src="js/balls3d.js"></script>
    <script src="js/cue3d.js"></script>
    <script src="js/pool-physics.js"></script>
    <script src="js/pool-game.js"></script>
</body>
</html>
