<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Classic Ludo</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Three.js 3D WebGL Canvas Viewport -->
    <div id="canvas-container"></div>

    <!-- UI Overlay HUD Layer -->
    <div class="ui-layer">
        <!-- Sleek Floating Status & Players Dock -->
        <div class="top-dock-panel interactive">
            <div class="top-status-row">
                <span class="status-pill" id="status-banner">Red Player rolls first!</span>
                <div class="players-bar" id="players-bar">
                    <!-- Dynamically populated by JS for active players -->
                </div>
                <button class="btn-chat-toggle" id="btn-chat-toggle" title="Open Chat">
                    <i class="fa-solid fa-comment-dots"></i>
                    <span class="chat-dot" id="chat-badge-dot"></span>
                </button>
            </div>
        </div>

        <!-- Floating Incoming Message Toast Bubble -->
        <div class="chat-toast-bubble" id="chat-toast-bubble"></div>

        <!-- Bottom Action HUD (Positioned safely above bottom app nav bar) -->
        <footer class="bottom-hud interactive">
            <button class="btn-roll-main" id="btn-roll-dice">
                <i class="fa-solid fa-dice"></i>
                <span>Roll 3D Dice</span>
            </button>
        </footer>
    </div>

    <!-- Floating Air-Glass Corner Chat HUD (Collapsible) -->
    <div class="floating-corner-chat interactive closed" id="floating-chat">
        <div class="air-chat-header">
            <span><i class="fa-solid fa-comments"></i> In-Game Chat</span>
            <button class="btn-close-chat" id="btn-close-chat" title="Close"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="air-chat-messages" id="panel-chat-messages">
            <!-- Up to 5 live match chat messages -->
        </div>
        <!-- Corner Quick Chat Buttons Bar -->
        <div class="air-chat-emojis">
            <button class="emoji-btn" data-emoji="Good Luck!" title="Good Luck!"><i class="fa-solid fa-clover"></i></button>
            <button class="emoji-btn" data-emoji="Nice Move!" title="Nice Move!"><i class="fa-solid fa-thumbs-up"></i></button>
            <button class="emoji-btn" data-emoji="Play Fast!" title="Play Fast!"><i class="fa-solid fa-bolt"></i></button>
            <button class="emoji-btn" data-emoji="Well Played!" title="Well Played!"><i class="fa-solid fa-trophy"></i></button>
            <button class="emoji-btn" data-emoji="GG!" title="GG!"><i class="fa-solid fa-handshake"></i></button>
        </div>
        <!-- Transparent Air Input -->
        <form class="air-chat-input-bar" id="panel-chat-form">
            <input type="text" id="panel-chat-input" placeholder="Type a message..." autocomplete="off">
            <button type="submit" title="Send"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
    </div>

    <!-- Victory Celebration Modal -->
    <div class="modal-overlay" id="modal-victory">
        <div class="victory-card interactive">
            <div class="victory-icon"><i class="fa-solid fa-trophy"></i></div>
            <h2 class="victory-title" id="victory-title">Victory!</h2>
            <p class="victory-desc">All pawns reached the Home triangle! Congratulations on winning the game!</p>
            <button class="btn-victory-replay" id="btn-play-again">
                <i class="fa-solid fa-play"></i> Play Again
            </button>
        </div>
    </div>

    <!-- Bundled Three.js Libraries -->
    <script src="js/lib/three.min.js"></script>
    <script src="js/lib/OrbitControls.js"></script>
    <script src="audio.js"></script>

    <!-- 3D Ludo Modules -->
    <script src="js/board3d.js"></script>
    <script src="js/pieces3d.js"></script>
    <script src="js/dice3d.js"></script>
    <script src="js/ludo-game.js"></script>
</body>
</html>
