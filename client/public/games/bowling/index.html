<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmic 3D Bowling</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Three.js 3D WebGL Canvas Viewport -->
    <div id="canvas-container"></div>

    <!-- UI Overlay HUD Layer -->
    <div class="ui-layer">
        <!-- Top Control Dock -->
        <header class="top-dock-panel interactive">
            <div class="top-row">
                <!-- Player Mode Selector (1P vs AI, 2P, 3P, 4P) -->
                <div class="mode-selector-wrap">
                    <span class="mode-label"><i class="fa-solid fa-users"></i> PLAYERS:</span>
                    <div class="mode-toggle">
                        <button class="mode-btn" data-mode="ai" id="btn-mode-ai">vs AI</button>
                        <button class="mode-btn active" data-mode="2p" id="btn-mode-2p">2P Duel</button>
                        <button class="mode-btn" data-mode="3p" id="btn-mode-3p">3P Trio</button>
                        <button class="mode-btn" data-mode="4p" id="btn-mode-4p">4P Party</button>
                    </div>
                </div>

                <!-- Utilities (Camera, Audio, Restart) -->
                <div class="top-utils">
                    <button class="btn-icon" id="btn-cam" title="Switch Camera View">
                        <i class="fa-solid fa-video"></i>
                        <span class="cam-badge" id="cam-badge">Cam 1</span>
                    </button>
                    <button class="btn-icon" id="btn-mute" title="Toggle Sound">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                    <button class="btn-icon" id="btn-restart" title="Reset Match">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </div>

            <!-- Dynamic Multi-Player Scoreboard Cards (1 to 4 Players) -->
            <div class="scoreboards-dock" id="scoreboards-dock">
                <!-- Dynamically generated by JS: P1, P2, P3, P4 -->
            </div>

            <!-- Match Center Announcer & 10-Pin Mini Radar -->
            <div class="announcer-bar">
                <div class="announcer-left">
                    <div class="frame-pill" id="frame-pill">Frame 1 / 10</div>
                    <div class="announcer-text" id="announcer-text">Player 1: Set Position & Roll!</div>
                </div>
                <!-- 10-Pin Mini Triangle Radar -->
                <div class="pin-radar" id="pin-radar" title="10-Pin Deck Radar">
                    <!-- Row 4 (7, 8, 9, 10) -->
                    <div class="radar-row">
                        <span class="radar-pin" id="rpin-7"></span>
                        <span class="radar-pin" id="rpin-8"></span>
                        <span class="radar-pin" id="rpin-9"></span>
                        <span class="radar-pin" id="rpin-10"></span>
                    </div>
                    <!-- Row 3 (4, 5, 6) -->
                    <div class="radar-row">
                        <span class="radar-pin" id="rpin-4"></span>
                        <span class="radar-pin" id="rpin-5"></span>
                        <span class="radar-pin" id="rpin-6"></span>
                    </div>
                    <!-- Row 2 (2, 3) -->
                    <div class="radar-row">
                        <span class="radar-pin" id="rpin-2"></span>
                        <span class="radar-pin" id="rpin-3"></span>
                    </div>
                    <!-- Row 1 (1) -->
                    <div class="radar-row">
                        <span class="radar-pin" id="rpin-1"></span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Bottom Controls Dock (Aim, Spin, Power, Roll) -->
        <footer class="bottom-dock interactive">
            <div class="controls-panel">
                <div class="controls-top-row">
                    <!-- Aim Position Slider -->
                    <div class="control-group">
                        <div class="ctrl-header">
                            <span><i class="fa-solid fa-arrows-left-right"></i> LANE POSITION</span>
                            <span id="pos-val" class="highlight-val">Center (0.0)</span>
                        </div>
                        <div class="slider-row">
                            <button class="btn-step" id="btn-pos-left" title="Step Left"><i class="fa-solid fa-chevron-left"></i></button>
                            <input type="range" min="-1.4" max="1.4" step="0.05" value="0" id="slider-pos" class="aim-slider">
                            <button class="btn-step" id="btn-pos-right" title="Step Right"><i class="fa-solid fa-chevron-right"></i></button>
                        </div>
                    </div>

                    <!-- Curve / Spin Slider -->
                    <div class="control-group">
                        <div class="ctrl-header">
                            <span><i class="fa-solid fa-tornado"></i> HOOK / SPIN</span>
                            <span id="spin-val" class="highlight-val">Straight</span>
                        </div>
                        <div class="slider-row">
                            <button class="btn-step" id="btn-spin-left" title="Spin Left"><i class="fa-solid fa-arrow-rotate-left"></i></button>
                            <input type="range" min="-0.035" max="0.035" step="0.005" value="0" id="slider-spin" class="aim-slider">
                            <button class="btn-step" id="btn-spin-right" title="Spin Right"><i class="fa-solid fa-arrow-rotate-right"></i></button>
                        </div>
                        <!-- Quick Spin Preset Buttons -->
                        <div class="spin-presets">
                            <button class="preset-btn" id="btn-preset-hook-l">Hook Left</button>
                            <button class="preset-btn active" id="btn-preset-straight">Straight</button>
                            <button class="preset-btn" id="btn-preset-hook-r">Hook Right</button>
                        </div>
                    </div>
                </div>

                <!-- Bottom Action Row: Power & Big Roll Button -->
                <div class="action-row">
                    <!-- Power Selector -->
                    <div class="power-select-group">
                        <span class="power-lbl"><i class="fa-solid fa-gauge-high"></i> POWER:</span>
                        <div class="power-pills">
                            <button class="power-pill" data-power="soft">Soft (70%)</button>
                            <button class="power-pill active" data-power="normal">Normal (85%)</button>
                            <button class="power-pill" data-power="turbo">Turbo (100%)</button>
                        </div>
                    </div>

                    <!-- Roll Ball Button -->
                    <button class="btn-roll" id="btn-roll">
                        <i class="fa-solid fa-bowling-ball"></i>
                        <span>ROLL BALL</span>
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <!-- Strike / Spare Popover Banner -->
    <div class="celebration-banner" id="celebration-banner">
        <div class="banner-title" id="banner-title">STRIKE! 🎳</div>
        <div class="banner-sub" id="banner-sub">Sensational Roll!</div>
    </div>

    <!-- Match Game Over Modal -->
    <div class="modal-overlay" id="modal-victory">
        <div class="victory-card interactive">
            <div class="trophy-icon">🏆</div>
            <h2 class="victory-title" id="victory-title">Match Finished!</h2>
            <p class="victory-subtitle" id="victory-subtitle">Congratulations to the Champion!</p>

            <div class="results-podium" id="results-podium">
                <!-- Dynamically populated by JS -->
            </div>

            <button class="btn-play-again" id="btn-rematch">
                <i class="fa-solid fa-rotate-right"></i>
                <span>Play Again / Rematch</span>
            </button>
        </div>
    </div>

    <!-- Bundled Three.js Library -->
    <script src="js/lib/three.min.js"></script>
    <script src="audio.js"></script>
    <script src="js/bowling-game.js"></script>
</body>
</html>
