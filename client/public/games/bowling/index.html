<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmic 3D Bowling</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Three.js 3D WebGL Canvas Viewport -->
    <div id="canvas-container"></div>

    <!-- UI Overlay HUD Layer -->
    <div class="ui-layer">
        <!-- Sleek Transparent Floating Top Bar -->
        <header class="top-dock-panel interactive">
            <div class="top-row">
                <!-- Mode Toggle (1P vs AI, 2P, 3P, 4P) -->
                <div class="mode-selector-wrap">
                    <div class="mode-toggle">
                        <button class="mode-btn" data-mode="ai" id="btn-mode-ai">AI</button>
                        <button class="mode-btn active" data-mode="2p" id="btn-mode-2p">2P</button>
                        <button class="mode-btn" data-mode="3p" id="btn-mode-3p">3P</button>
                        <button class="mode-btn" data-mode="4p" id="btn-mode-4p">4P</button>
                    </div>
                </div>

                <!-- Utilities (Camera, Orbit, Sound, Reset) -->
                <div class="top-utils">
                    <button class="btn-icon" id="btn-cam" title="Camera Angle">
                        <i class="fa-solid fa-video"></i>
                        <span class="cam-badge" id="cam-badge">Cam 1</span>
                    </button>
                    <button class="btn-icon" id="btn-orbit" title="Free 3D Orbit View">
                        <i class="fa-solid fa-arrows-spin"></i>
                    </button>
                    <button class="btn-icon" id="btn-mute" title="Toggle Sound">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                    <button class="btn-icon" id="btn-restart" title="Reset Match">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </div>

            <!-- Dynamic Floating Player Chips -->
            <div class="scoreboards-dock" id="scoreboards-dock">
                <!-- Filled dynamically by JS -->
            </div>

            <!-- Announcer Pill & 10-Pin Mini Radar -->
            <div class="status-floating-pill">
                <span class="announcer-text" id="announcer-text">Player 1: Aim & Roll!</span>
                <div class="pin-mini-radar" id="pin-radar" title="10-Pin Radar">
                    <!-- Row 4 -->
                    <div class="radar-row">
                        <span class="radar-pin" id="rpin-7"></span>
                        <span class="radar-pin" id="rpin-8"></span>
                        <span class="radar-pin" id="rpin-9"></span>
                        <span class="radar-pin" id="rpin-10"></span>
                    </div>
                    <!-- Row 3 -->
                    <div class="radar-row">
                        <span class="radar-pin" id="rpin-4"></span>
                        <span class="radar-pin" id="rpin-5"></span>
                        <span class="radar-pin" id="rpin-6"></span>
                    </div>
                    <!-- Row 2 -->
                    <div class="radar-row">
                        <span class="radar-pin" id="rpin-2"></span>
                        <span class="radar-pin" id="rpin-3"></span>
                    </div>
                    <!-- Row 1 -->
                    <div class="radar-row">
                        <span class="radar-pin" id="rpin-1"></span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Touch Lane Drag Hint -->
        <div class="lane-hint" id="lane-hint">
            <i class="fa-solid fa-hand-pointer"></i>
            <span>Drag lane to position ball</span>
        </div>

        <!-- Sleek Transparent Floating Bottom Control Dock -->
        <footer class="bottom-dock interactive">
            <div class="controls-glass-bar">
                <!-- Position track with steppers -->
                <div class="controls-row-1">
                    <div class="pos-control-wrap">
                        <span class="ctrl-tag"><i class="fa-solid fa-arrows-left-right"></i> POSITION:</span>
                        <button class="btn-step" id="btn-pos-left" title="Step Left"><i class="fa-solid fa-chevron-left"></i></button>
                        <input type="range" min="-1.4" max="1.4" step="0.05" value="0" id="slider-pos" class="aim-slider">
                        <button class="btn-step" id="btn-pos-right" title="Step Right"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>

                <!-- Spin, Power & Roll button in one sleek row -->
                <div class="controls-row-2">
                    <div class="spin-group">
                        <button class="preset-btn" id="btn-preset-hook-l" title="Hook Left">◀ Hook L</button>
                        <button class="preset-btn active" id="btn-preset-straight" title="Straight">Straight</button>
                        <button class="preset-btn" id="btn-preset-hook-r" title="Hook Right">Hook R ▶</button>
                    </div>

                    <div class="power-toggle">
                        <button class="power-pill active" data-power="normal" title="Normal Power">Normal</button>
                        <button class="power-pill" data-power="turbo" title="Turbo Strike Power">Turbo 🔥</button>
                    </div>

                    <button class="btn-roll" id="btn-roll">
                        <i class="fa-solid fa-bowling-ball"></i>
                        <span>ROLL</span>
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <!-- Strike / Spare Popover Banner -->
    <div class="celebration-banner" id="celebration-banner">
        <div class="banner-title" id="banner-title">STRIKE! 🎳</div>
        <div class="banner-sub" id="banner-sub">Perfect Pocket Hit!</div>
    </div>

    <!-- Match Game Over Modal -->
    <div class="modal-overlay" id="modal-victory">
        <div class="victory-card interactive">
            <div class="trophy-icon">🏆</div>
            <h2 class="victory-title" id="victory-title">Match Finished!</h2>
            <p class="victory-subtitle" id="victory-subtitle">Congratulations to the Champion!</p>

            <div class="results-podium" id="results-podium">
                <!-- Populated by JS -->
            </div>

            <button class="btn-play-again" id="btn-rematch">
                <i class="fa-solid fa-rotate-right"></i>
                <span>Play Again / Rematch</span>
            </button>
        </div>
    </div>

    <!-- Bundled Three.js Libraries -->
    <script src="js/lib/three.min.js"></script>
    <script src="js/lib/OrbitControls.js"></script>
    <script src="audio.js"></script>
    <script src="js/bowling-game.js"></script>
</body>
</html>
