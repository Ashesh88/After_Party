<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmic 3D Bowling</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Three.js 3D WebGL Canvas Viewport -->
    <div id="canvas-container"></div>

    <!-- UI Overlay HUD Layer -->
    <div class="ui-layer">
        <!-- Top Control Dock -->
        <header class="top-dock-panel interactive">
            <div class="top-row">
                <!-- Mode Toggle -->
                <div class="mode-toggle">
                    <button class="mode-btn active" id="btn-mode-2p">
                        <i class="fa-solid fa-users"></i>
                        <span>2-Player Duel</span>
                    </button>
                    <button class="mode-btn" id="btn-mode-bot">
                        <i class="fa-solid fa-robot"></i>
                        <span>vs Bot</span>
                    </button>
                </div>

                <!-- Utilities -->
                <div class="top-utils">
                    <button class="btn-icon" id="btn-cam" title="Toggle Camera">
                        <i class="fa-solid fa-video"></i>
                    </button>
                    <button class="btn-icon" id="btn-mute" title="Toggle Sound">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                    <button class="btn-icon" id="btn-restart" title="New Game">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </div>

            <!-- Dual Scoreboard Cards (P1 & P2) -->
            <div class="scoreboards-dock">
                <!-- P1 Scorecard -->
                <div class="player-scorecard p1-card active-turn" id="p1-card">
                    <div class="card-head">
                        <span class="p-badge p1-badge">P1</span>
                        <span class="p-name" id="p1-name">You</span>
                        <span class="turn-dot"></span>
                    </div>
                    <div class="score-display">
                        <span class="score-num" id="p1-total">0</span>
                        <span class="score-lbl">PTS</span>
                    </div>
                    <div class="frame-indicators" id="p1-frames">
                        <!-- Filled by JS -->
                    </div>
                </div>

                <!-- Match Center Announcer -->
                <div class="announcer-box">
                    <div class="frame-pill" id="frame-pill">Frame 1 / 10</div>
                    <div class="announcer-text" id="announcer-text">Aim & Roll the Ball!</div>
                </div>

                <!-- P2 Scorecard -->
                <div class="player-scorecard p2-card" id="p2-card">
                    <div class="card-head">
                        <span class="p-badge p2-badge">P2</span>
                        <span class="p-name" id="p2-name">Friend</span>
                        <span class="turn-dot"></span>
                    </div>
                    <div class="score-display">
                        <span class="score-num" id="p2-total">0</span>
                        <span class="score-lbl">PTS</span>
                    </div>
                    <div class="frame-indicators" id="p2-frames">
                        <!-- Filled by JS -->
                    </div>
                </div>
            </div>
        </header>

        <!-- Bottom Controls Dock (Aim Position, Spin & Power Roll) -->
        <footer class="bottom-dock interactive">
            <div class="controls-panel">
                <!-- Aim Position Slider -->
                <div class="control-group">
                    <div class="ctrl-header">
                        <span>LANE POSITION</span>
                        <span id="pos-val">Center</span>
                    </div>
                    <div class="slider-row">
                        <button class="btn-step" id="btn-pos-left"><i class="fa-solid fa-chevron-left"></i></button>
                        <input type="range" min="-1.4" max="1.4" step="0.1" value="0" id="slider-pos" class="aim-slider">
                        <button class="btn-step" id="btn-pos-right"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>

                <!-- Curve / Spin Slider -->
                <div class="control-group">
                    <div class="ctrl-header">
                        <span>HOOK / SPIN</span>
                        <span id="spin-val">Straight</span>
                    </div>
                    <div class="slider-row">
                        <button class="btn-step" id="btn-spin-left"><i class="fa-solid fa-arrow-rotate-left"></i></button>
                        <input type="range" min="-0.03" max="0.03" step="0.005" value="0" id="slider-spin" class="aim-slider">
                        <button class="btn-step" id="btn-spin-right"><i class="fa-solid fa-arrow-rotate-right"></i></button>
                    </div>
                </div>

                <!-- Roll Ball Button with Power Charge -->
                <div class="roll-btn-box">
                    <button class="btn-roll" id="btn-roll">
                        <i class="fa-solid fa-bowling-ball"></i>
                        <span>ROLL BALL</span>
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <!-- Strike / Spare Popover Banner -->
    <div class="celebration-banner" id="celebration-banner">
        <div class="banner-title" id="banner-title">STRIKE! 🎳</div>
    </div>

    <!-- Match Game Over Modal -->
    <div class="modal-overlay" id="modal-victory">
        <div class="victory-card interactive">
            <div class="trophy-icon">🏆</div>
            <h2 class="victory-title" id="victory-title">Match Finished!</h2>
            <p class="victory-subtitle" id="victory-subtitle">Congratulations to the Champion!</p>

            <div class="results-box">
                <div class="res-row" id="p1-res-row">
                    <span class="res-name" id="res-p1-name">You</span>
                    <span class="res-pts" id="res-p1-pts">142 PTS</span>
                </div>
                <div class="res-row" id="p2-res-row">
                    <span class="res-name" id="res-p2-name">Friend</span>
                    <span class="res-pts" id="res-p2-pts">128 PTS</span>
                </div>
            </div>

            <button class="btn-play-again" id="btn-rematch">
                <i class="fa-solid fa-rotate-right"></i>
                <span>Rematch / Play Again</span>
            </button>
        </div>
    </div>

    <!-- Bundled Three.js Library -->
    <script src="js/lib/three.min.js"></script>
    <script src="audio.js"></script>
    <script src="js/bowling-game.js"></script>
</body>
</html>
