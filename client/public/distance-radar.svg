<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14142b" />
      <stop offset="100%" stop-color="#0a0a16" />
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background grid map -->
  <rect width="800" height="450" fill="url(#bg)" />
  
  <!-- Subtle coordinate lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Radar circles from center -->
  <circle cx="400" cy="225" r="140" fill="none" stroke="rgba(244,63,94,0.08)" stroke-width="1.5" stroke-dasharray="4,4" />
  <circle cx="400" cy="225" r="220" fill="none" stroke="rgba(168,85,247,0.06)" stroke-width="1.5" stroke-dasharray="6,6" />

  <!-- Dotted Connection Arc -->
  <path d="M 240 240 Q 400 130 560 210" fill="none" stroke="url(#pulse)" stroke-width="3" stroke-dasharray="6,6" filter="url(#softGlow)" />

  <!-- Point A (You) -->
  <g transform="translate(240, 240)">
    <circle r="32" fill="rgba(244,63,94,0.15)" />
    <circle r="18" fill="#f43f5e" />
    <!-- Heart Icon inside Point A -->
    <path d="M0 6s-7-4.2-7-9.3c0-2.6 2.1-4.7 4.7-4.7 1.7 0 3.2 0.9 4 2.2 0.8-1.3 2.3-2.2 4-2.2 2.6 0 4.7 2.1 4.7 4.7 0 5.1-7.4 9.3-7.4 9.3z" fill="#ffffff" />
    <rect x="-35" y="24" width="70" height="24" rx="12" fill="#1b1b33" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="0" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">You</text>
  </g>

  <!-- Point B (Partner) -->
  <g transform="translate(560, 210)">
    <circle r="32" fill="rgba(168,85,247,0.15)" />
    <circle r="18" fill="#a855f7" />
    <!-- Heart Icon inside Point B -->
    <path d="M0 6s-7-4.2-7-9.3c0-2.6 2.1-4.7 4.7-4.7 1.7 0 3.2 0.9 4 2.2 0.8-1.3 2.3-2.2 4-2.2 2.6 0 4.7 2.1 4.7 4.7 0 5.1-7.4 9.3-7.4 9.3z" fill="#ffffff" />
    <rect x="-42" y="24" width="84" height="24" rx="12" fill="#1b1b33" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="0" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Partner</text>
  </g>

  <!-- Distance HUD Badge -->
  <g transform="translate(400, 140)">
    <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#17172e" stroke="rgba(244,63,94,0.3)" stroke-width="1.5" filter="url(#softGlow)" />
    <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fda4af">1,240 km apart</text>
  </g>

  <!-- Sample Preview Tag -->
  <rect x="20" y="20" width="105" height="24" rx="12" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.1)" />
  <text x="72" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Sample preview</text>
</svg>
